<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none">
  <rect width="480" height="200" rx="16" fill="#faf7ff"/>
  <text x="80" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11">① 侧卧叠膝</text>
  <text x="240" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11">② 打开中</text>
  <text x="400" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11">③ 完全打开</text>
  <!-- shared ground -->
  <line x1="20" y1="170" x2="460" y2="170" stroke="#e9d5ff" stroke-width="2"/>
  <!-- F1 -->
  <g transform="translate(80,140)">
    <ellipse cx="0" cy="10" rx="28" ry="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="-20" cy="-10" r="12" fill="#f3e8ff" stroke="#a78bfa" stroke-width="2"/>
    <line x1="-8" y1="-5" x2="30" y2="-8" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="5" x2="25" y2="25" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="8" x2="22" y2="28" stroke="#f9a8d4" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- F2 -->
  <g transform="translate(240,140)">
    <ellipse cx="0" cy="10" rx="28" ry="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="-18" cy="-12" r="12" fill="#fff1f2" stroke="#f9a8d4" stroke-width="2"/>
    <line x1="-8" y1="-5" x2="10" y2="-35" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="5" x2="25" y2="25" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="8" x2="22" y2="28" stroke="#f9a8d4" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- F3 -->
  <g transform="translate(400,140)">
    <ellipse cx="0" cy="10" rx="28" ry="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="-10" cy="-20" r="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <line x1="-5" y1="-8" x2="-5" y2="-50" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="5" x2="25" y2="25" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="8" x2="22" y2="28" stroke="#f9a8d4" stroke-width="3" stroke-linecap="round"/>
    <text x="20" y="-40" fill="#0d9488" font-size="10">目光跟随</text>
  </g>
  <line x1="160" y1="40" x2="160" y2="180" stroke="#e9d5ff" stroke-width="1"/>
  <line x1="320" y1="40" x2="320" y2="180" stroke="#e9d5ff" stroke-width="1"/>
</svg>
