  <text x="400" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11">③ 顶峰稍停</text>
  <line x1="20" y1="170" x2="460" y2="170" stroke="#e9d5ff" stroke-width="2"/>
  <g transform="translate(80,130)">
    <line x1="0" y1="30" x2="0" y2="-20" stroke="#a78bfa" stroke-width="4"/>
    <circle cx="0" cy="-38" r="14" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
    <line x1="5" y1="-10" x2="55" y2="-15" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
