<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" fill="none">
  <rect width="520" height="240" rx="16" fill="#faf7ff"/>
  <text x="90" y="24" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="bold">① 肩胛贴床</text>
  <text x="260" y="24" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="bold">② 冲拳推离</text>
  <text x="430" y="24" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="bold">③ 控制回落</text>
  <line x1="20" y1="200" x2="500" y2="200" stroke="#ddd6fe" stroke-width="3"/>
  <!-- F1 -->
  <g transform="translate(90,190)">
    <ellipse cx="0" cy="0" rx="50" ry="14" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="-30" cy="-8" r="12" fill="#e9d5ff" stroke="#a78bfa" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="-90" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-100" r="10" fill="#fda4af" stroke="#be185d" stroke-width="2"/>
    <rect x="-18" y="-20" width="20" height="12" rx="2" fill="#c4b5fd" opacity="0.5"/>
    <text x="0" y="30" text-anchor="middle" fill="#7c3aed" font-size="10">肘伸直 · 垂直</text>
  </g>
  <!-- F2 punch -->
  <g transform="translate(260,190)">
    <ellipse cx="0" cy="0" rx="50" ry="14" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="-30" cy="-8" r="12" fill="#e9d5ff" stroke="#a78bfa" stroke-width="2"/>
    <line x1="8" y1="-20" x2="8" y2="-105" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/>
    <circle cx="8" cy="-115" r="10" fill="#5eead4" stroke="#0d9488" stroke-width="2"/>
    <!-- scapula lifted gap -->
    <path d="M-10 -8 Q8 -28 20 -8" stroke="#f9a8d4" stroke-width="2.5" fill="none"/>
    <text x="35" y="-50" fill="#be185d" font-size="11">↑ 肩胛离床</text>
    <text x="8" y="30" text-anchor="middle" fill="#0d9488" font-size="10">Plus 前伸</text>
  </g>
  <!-- F3 -->
  <g transform="translate(430,190)">
    <ellipse cx="0" cy="0" rx="50" ry="14" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="-30" cy="-8" r="12" fill="#e9d5ff" stroke="#a78bfa" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="-90" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-100" r="10" fill="#fda4af" stroke="#be185d" stroke-width="2"/>
    <path d="M5 -70 L5 -40" stroke="#8b5cf6" stroke-width="2" marker-end="url(#dn)"/>
    <text x="0" y="30" text-anchor="middle" fill="#7c3aed" font-size="10">缓慢贴回</text>
  </g>
  <defs>
    <marker id="dn" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto"><path d="M0,0 L3,6 L6,0" fill="#8b5cf6"/></marker>
  </defs>
  <line x1="175" y1="40" x2="175" y2="220" stroke="#e9d5ff" stroke-width="1"/>
  <line x1="345" y1="40" x2="345" y2="220" stroke="#e9d5ff" stroke-width="1"/>
</svg>
