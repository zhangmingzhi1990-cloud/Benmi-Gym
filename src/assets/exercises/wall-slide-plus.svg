<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" fill="none">
  <rect width="480" height="220" rx="16" fill="#faf7ff"/>
  <text x="80" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11">① W 贴墙</text>
  <text x="240" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11">② 上滑</text>
  <text x="400" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11">③ Plus 顶峰</text>
  <!-- wall lines -->
  <line x1="40" y1="40" x2="40" y2="200" stroke="#e9d5ff" stroke-width="3"/>
  <line x1="200" y1="40" x2="200" y2="200" stroke="#e9d5ff" stroke-width="3"/>
  <line x1="360" y1="40" x2="360" y2="200" stroke="#e9d5ff" stroke-width="3"/>
  <!-- F1 W -->
  <g transform="translate(90,150)">
    <line x1="0" y1="40" x2="0" y2="-30" stroke="#a78bfa" stroke-width="4"/>
    <circle cx="0" cy="-48" r="14" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
    <path d="M-8 -30 L-28 -10 L-20 10" stroke="#fda4af" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M8 -30 L28 -10 L20 10" stroke="#fda4af" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="0" y="58" text-anchor="middle" fill="#be185d" font-size="9">不耸肩</text>
  </g>
  <!-- F2 up -->
  <g transform="translate(250,150)">
    <line x1="0" y1="40" x2="0" y2="-30" stroke="#a78bfa" stroke-width="4"/>
    <circle cx="0" cy="-48" r="14" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
    <path d="M-8 -30 L-22 -55 L-18 -75" stroke="#f9a8d4" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M8 -30 L22 -55 L18 -75" stroke="#f9a8d4" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- F3 plus -->
  <g transform="translate(410,150)">
    <line x1="0" y1="40" x2="0" y2="-30" stroke="#a78bfa" stroke-width="4"/>
    <circle cx="0" cy="-48" r="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <path d="M-8 -30 L-24 -60 L-20 -82" stroke="#0d9488" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M8 -30 L24 -60 L20 -82" stroke="#0d9488" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-12 -20 Q0 -28 12 -20" stroke="#5eead4" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="0" y="58" text-anchor="middle" fill="#0d9488" font-size="9">肩胛外展+</text>
  </g>
</svg>
