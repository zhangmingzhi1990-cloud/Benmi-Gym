<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#f7f5ff"/>
  <text id="title" x="24" y="36" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#6d28d9">Open Book · 合拢 ↔ 打开</text>
  <text x="24" y="58" font-family="system-ui,sans-serif" font-size="13" fill="#6b7280">标准：侧卧叠膝 · 双臂前伸合掌 → 上方手臂向后打开（胸椎转）</text>
  <rect x="80" y="210" width="480" height="70" rx="12" fill="#ddd6fe"/>
  <rect x="95" y="195" width="70" height="28" rx="8" fill="#c4b5fd"/>
  <!-- head -->
  <circle cx="130" cy="200" r="22" fill="#f5d0c5" stroke="#9a6b5c" stroke-width="2">
    <animate attributeName="cy" values="200;185;200" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- torso -->
  <ellipse cx="230" cy="215" rx="70" ry="28" fill="#a78bfa" stroke="#6d28d9" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" values="0 230 215;-25 230 215;0 230 215" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="215;200;215" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="310" cy="230" rx="34" ry="24" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
  <!-- legs fixed stacked -->
  <path d="M330 240 L390 290" stroke="#7c3aed" stroke-width="18" stroke-linecap="round"/>
  <path d="M332 248 L392 298" stroke="#6d28d9" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M390 290 L455 255" stroke="#7c3aed" stroke-width="16" stroke-linecap="round"/>
  <path d="M392 298 L457 263" stroke="#6d28d9" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <!-- bottom arm fixed forward -->
  <path d="M185 215 L300 175" stroke="#f5d0c5" stroke-width="14" stroke-linecap="round"/>
  <circle cx="302" cy="176" r="8" fill="#f5d0c5" stroke="#9a6b5c" stroke-width="1.5"/>
  <!-- top arm animates from stacked forward to open back -->
  <path id="topArm" d="M190 222 L305 182" fill="none" stroke="#e8b4a8" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M190 222 L305 182;M200 195 L250 120 L310 85;M190 222 L305 182" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <circle id="topHand" cx="308" cy="182" r="7" fill="#e8b4a8" stroke="#9a6b5c" stroke-width="1.5">
    <animate attributeName="cx" values="308;310;308" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="182;85;182" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <rect x="400" y="90" width="210" height="78" rx="10" fill="#fff" stroke="#c4b5fd"/>
  <text x="415" y="118" font-family="system-ui,sans-serif" font-size="14" fill="#4c1d95">膝始终叠放（绿区）</text>
  <text x="415" y="142" font-family="system-ui,sans-serif" font-size="14" fill="#4c1d95">打开=上方手臂向后</text>
  <rect x="385" y="255" width="90" height="28" rx="8" fill="#d1fae5" stroke="#10b981"/>
  <text x="400" y="274" font-family="system-ui,sans-serif" font-size="13" fill="#065f46">膝叠放✓</text>
</svg>
